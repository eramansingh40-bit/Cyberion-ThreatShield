title: PowerShell Encoded Command
id: 8f7c1a2e-1234-4b56-9abc-123456789002
status: experimental
description: Detects PowerShell commands using encoded command execution.
author: Cyberion-ThreatShield
date: 2026-08-11
logsource:
  product: windows
  category: process_creation

detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - '-EncodedCommand'
      - '-enc '
      - '/EncodedCommand'
  condition: selection

falsepositives:
  - Legitimate administrative automation
  - Security testing

level: high

tags:
  - attack.execution
  - attack.t1059.001
